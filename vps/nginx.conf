# Nginx-Konfiguration fuer Kinderwitzemaschine
# Datei auf VPS kopieren nach:
#   /etc/nginx/sites-available/kinderwitzemaschine
#
# WICHTIG: DEINE_DOMAIN ersetzen durch deine DuckDNS-Domain
#          z.B.: kinderwitzemaschine.duckdns.org

server {
    listen 80;
    server_name DEINE_DOMAIN;

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_buffering    off;
    }
}

# Hinweis: Der HTTPS-Block (Port 443) wird automatisch von
# Certbot hinzugefuegt, wenn du folgenden Befehl ausfuehrst:
#   sudo certbot --nginx -d DEINE_DOMAIN
